name: iOS Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Deploy iOS to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager in Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Precache iOS Artifacts
        run: flutter precache --ios

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter build ios --config-only --release --no-codesign

      - name: Write App Store Connect API Key File & Register Bundle ID
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          mkdir -p "$HOME/private_keys"
          TARGET_KEY="$HOME/.appstoreconnect/private_keys/AuthKey_9HC3ZFHYQ7.p8"
          printf "%s\n" "-----BEGIN PRIVATE KEY-----" > "$TARGET_KEY"
          printf "%s\n" "MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQggirxemIOJ0dlsLBJ" >> "$TARGET_KEY"
          printf "%s\n" "9jbKPEcTJWI5i4OqpR+6Hv0JJ6KgCgYIKoZIzj0DAQehRANCAARACJZYyIKA/J4A" >> "$TARGET_KEY"
          printf "%s\n" "E0oWMjQECeR0pfOndYymen5P8Q7ba7o4l+IdZzDSNjbZyQ0I6oVlZi54EbeUkz9m" >> "$TARGET_KEY"
          printf "%s\n" "xMlFxhoE" >> "$TARGET_KEY"
          printf "%s\n" "-----END PRIVATE KEY-----" >> "$TARGET_KEY"
          cp "$TARGET_KEY" "$HOME/private_keys/AuthKey_9HC3ZFHYQ7.p8"

          python3 -m pip install --break-system-packages pyjwt cryptography requests --quiet || true
          python3 - << 'EOF'
          import time, os, jwt, requests
          key_path = os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey_9HC3ZFHYQ7.p8")
          with open(key_path, "r") as f:
              private_key = f.read()
          token = jwt.encode(
              {"iss": "b4575c22-8a31-4f97-bed4-889e3c21a7b5", "iat": int(time.time()), "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": "9HC3ZFHYQ7", "typ": "JWT"}
          )
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          bundle_id = "com.scannify.receiptscanner.expensetracker"
          r = requests.get(f"https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]={bundle_id}", headers=headers)
          data = r.json().get("data", [])
          if not data:
              print(f"Registering Bundle ID {bundle_id} on Apple Developer Portal...")
              payload = {
                  "data": {
                      "type": "bundleIds",
                      "attributes": {
                          "identifier": bundle_id,
                          "name": "AI Receipt scanner Tax tracker",
                          "platform": "UNIVERSAL"
                      }
                  }
              }
              res = requests.post("https://api.appstoreconnect.apple.com/v1/bundleIds", headers=headers, json=payload)
              print("Bundle ID registration status:", res.status_code, res.text)
          else:
              print(f"Bundle ID {bundle_id} already registered (id={data[0]['id']}).")
          EOF

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>JTVCP8PGV8</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Build Unsigned IPA Archive via Flutter
        run: |
          BUILD_NUM=$((10 + GITHUB_RUN_NUMBER))
          echo "Building iOS archive with dynamic build number: $BUILD_NUM"
          flutter build ipa --release --no-codesign --no-tree-shake-icons --build-number=$BUILD_NUM

      - name: Export Signed IPA via App Store Connect API Key
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_9HC3ZFHYQ7.p8"
          ARCHIVE_PATH=$(find build/ios -name "*.xcarchive" -type d 2>/dev/null | head -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            ARCHIVE_PATH="build/ios/archive/Runner.xcarchive"
          fi
          echo "Found xcarchive at: $ARCHIVE_PATH"

          mkdir -p build/ios/ipa

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "9HC3ZFHYQ7" \
            -authenticationKeyIssuerID "b4575c22-8a31-4f97-bed4-889e3c21a7b5"

      - name: Upload Signed IPA to App Store Connect / TestFlight
        run: |
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            IPA_FILE=$(find build/ios -name "*.ipa" 2>/dev/null | head -n 1)
          fi
          echo "Uploading $IPA_FILE to App Store Connect..."
          xcrun altool --upload-app -f "$IPA_FILE" -t ios --apiKey "9HC3ZFHYQ7" --apiIssuer "b4575c22-8a31-4f97-bed4-889e3c21a7b5" --verbose

      - name: Archive Signed IPA Artifact on GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scannify-iOS-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
